name: Avis d'échéance

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npx playwright install chromium

      - run: npm run avis
        env:
          RENTILA_EMAIL: ${{ secrets.RENTILA_EMAIL || '' }}
          RENTILA_PASSWORD: ${{ secrets.RENTILA_PASSWORD || '' }}
          TENANT_EMAILS: ${{ secrets.TENANT_EMAILS || 'test@example.com' }}
          TENANT_NAMES: ${{ secrets.TENANT_NAMES || '' }}
          DRY_RUN: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: downloads-avis
          path: downloads/
